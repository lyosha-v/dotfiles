set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'jbnicolai/tmux-fpp'
# C-h/j/k/l moves between vim splits and tmux panes interchangeably, so the
# boundary between them stops mattering. Pairs with vim-tmux-focus-events,
# already in .vimrc, and with focus-events below.
set -g @plugin 'christoomey/vim-tmux-navigator'

# see https://github.com/tmux-plugins/tpm/blob/master/docs/automatic_tpm_installation.md
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

set -g prefix C-a
bind C-a send-prefix
unbind-key C-b

set -g status-keys vi
setw -g mode-keys vi

# https://github.com/tmux/tmux/issues/108
set -g status-interval 0

# Terminal with italic support
set -g default-terminal 'tmux-256color'
set -as terminal-overrides ',xterm*:Tc:sitm=\E[3m'

# Passes terminal focus in and out of tmux through to the programs inside it.
# Without this, .vimrc's FocusGained hook never fires under tmux, so vim does
# not notice a light/dark switch, and vim-tmux-focus-events does nothing.
set -g focus-events on

# Mouse support
set-option -g mouse on

# Windows and panes count from 1: 0 is at the wrong end of the keyboard.
set -g base-index 1
setw -g pane-base-index 1
# Closing a middle window would otherwise leave a hole in the numbering.
set -g renumber-windows on

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# New panes open in the directory the current one is in, rather than $HOME.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

bind r source-file ~/.tmux.conf \; display "Reloaded ~/.tmux.conf"

# Catppuccin, following the macOS appearance the way .vimrc, bat and delta do.
# tmux has no hook for a system theme change, so this is read when the server
# starts; `C-a r` re-reads it.
if-shell 'defaults read -g AppleInterfaceStyle 2>/dev/null | grep -q Dark' \
    'set -g @catppuccin_flavour "mocha"' \
    'set -g @catppuccin_flavour "latte"'

# Keep tpm last: it reads every @plugin set above it.
run '~/.tmux/plugins/tpm/tpm'
